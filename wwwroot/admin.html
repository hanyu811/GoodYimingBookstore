<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>管理后台 - 好一鸣书店</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">好一鸣书店</div>
    <div class="navbar-nav">
      <span id="userChip" class="user-chip">管理员中心</span>
      <a href="#" class="nav-link active">账号治理</a>
      <a href="/swagger" target="_blank" class="nav-link">API 开放平台</a>
      <button id="logoutBtn" class="nav-btn" style="background:#49534f;">退出登录</button>
    </div>
  </nav>

  <main class="container">
    <section class="page-head">
      <h2>平台账号治理后台</h2>
      <p>集中管理读者、商家与管理员账号，支持新建、编辑、删除和角色管控。</p>
    </section>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">读者账号</div>
        <div class="stat-value" id="statReaders">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">商家账号</div>
        <div class="stat-value" id="statSellers">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">管理员账号</div>
        <div class="stat-value" id="statAdmins">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">平台总账号</div>
        <div class="stat-value" id="statTotalAccounts">0</div>
      </div>
    </div>

    <div class="admin-panel">
      <div class="admin-header">
        <h2>👤 新建 / 编辑账号</h2>
      </div>
      <input type="hidden" id="userId" />
      <div class="form-grid">
        <div class="form-group">
          <label>用户名</label>
          <input id="userName" type="text" class="form-control" placeholder="如：reader2" />
        </div>
        <div class="form-group">
          <label>显示名</label>
          <input id="displayName" type="text" class="form-control" placeholder="如：张三" />
        </div>
        <div class="form-group">
          <label>角色</label>
          <select id="role" class="form-control">
            <option value="reader">读者</option>
            <option value="seller">商家</option>
            <option value="admin">管理员</option>
          </select>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input id="password" type="password" class="form-control" placeholder="创建时必填，编辑时可留空" />
        </div>
      </div>
      <p id="message" class="info-msg"></p>
      <div style="margin-top:20px; display:flex; gap:10px;">
        <button id="saveBtn" class="nav-btn">💾 保存账号</button>
        <button id="resetBtn" class="nav-btn" style="background: #8a8f89;">↺ 清空表单</button>
      </div>
    </div>

    <div class="admin-header">
      <h2>🧾 平台账号列表</h2>
      <button class="nav-btn" onclick="loadUsers()" style="background:#4f7c68;">↻ 刷新列表</button>
    </div>
    <div class="admin-table-container admin-users-table-wrap">
      <table class="admin-table admin-users-table">
        <colgroup>
          <col class="col-user-id" />
          <col class="col-user-name" />
          <col class="col-user-display-name" />
          <col class="col-user-role" />
          <col class="col-user-actions" />
        </colgroup>
        <thead>
          <tr>
            <th>ID</th>
            <th>用户名</th>
            <th>显示名</th>
            <th>角色</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="adminUserList"></tbody>
      </table>
    </div>
    <div id="adminUsersPagination" class="pagination panel-pagination"></div>
  </main>

  <footer class="footer">
    <p>© 2026 好一鸣书店 - 管理员账号管理子系统</p>
  </footer>

  <script src="/admin.js"></script>
</body>
</html>
