<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>我的订单 - 好一鸣书店</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">好一鸣书店</div>
    <div class="navbar-nav">
      <span id="userChip" class="user-chip">读者中心</span>
      <a href="/store.html" class="nav-link">书城首页</a>
      <a href="/cart.html" class="nav-link">我的购物车</a>
      <a href="#" class="nav-link active">我的订单</a>
      <button id="logoutBtn" class="nav-btn" style="background:#49534f;">退出登录</button>
    </div>
  </nav>

  <main class="container">
    <section class="page-head">
      <h2>订单管理中心</h2>
      <p>查看历史订单、收货信息与物流状态，并支持确认收货。</p>
    </section>

    <section class="stats-grid">
      <div class="stat-card soft">
        <div class="stat-label">订单总数</div>
        <div class="stat-value" id="orderCount">0</div>
      </div>
      <div class="stat-card soft">
        <div class="stat-label">累计消费金额</div>
        <div class="stat-value" id="orderAmount">0.00</div>
      </div>
      <div class="stat-card soft">
        <div class="stat-label">已收货订单</div>
        <div class="stat-value" id="receivedOrderCount">0</div>
      </div>
    </section>

    <div class="admin-header">
      <h2>🧾 下单记录</h2>
      <button class="nav-btn" onclick="loadOrders()" style="background:#4f7c68;">↻ 刷新订单</button>
    </div>

    <div class="admin-table-container reader-orders-table-wrap">
      <table class="admin-table reader-orders-table">
        <colgroup>
          <col class="col-reader-order-id" />
          <col class="col-reader-order-date" />
          <col class="col-reader-order-address" />
          <col class="col-reader-order-phone" />
          <col class="col-reader-order-items" />
          <col class="col-reader-order-amount" />
          <col class="col-reader-order-status" />
          <col class="col-reader-order-actions" />
        </colgroup>
        <thead>
          <tr>
            <th>订单号</th>
            <th>下单时间</th>
            <th>收货地址</th>
            <th>联系电话</th>
            <th>购买明细</th>
            <th>总金额</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="orderList"></tbody>
      </table>
    </div>
    <div id="readerOrdersPagination" class="pagination panel-pagination"></div>
    <p id="orderMessage" class="info-msg"></p>
  </main>

  <footer class="footer">
    <p>© 2026 好一鸣书店 - 读者订单子系统</p>
  </footer>

  <script src="/orders.js"></script>
</body>
</html>
